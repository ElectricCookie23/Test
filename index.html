<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 2000s-style DVD screensaver: every bounce has a 1-in-100 chance of hitting the corner. Click to rebuild the logo a different way.">
<title>Corner Odds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap">

<style>
  :root{
    --void:#07070b;
    --void-lift:#0d101a;
    --panel:rgba(13,16,26,.66);
    --edge-hi:rgba(140,185,255,.20);
    --edge-lo:rgba(0,0,0,.65);
    --ink:#c3d2e8;
    --ink-dim:#66748c;
    --ink-faint:#3d4759;
    --cyan:#00e7ff;
    --gold:#ffd447;
    --hot:#ff2ea6;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--void);
    color:var(--ink);
    font-family:"Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-font-smoothing:antialiased;
    cursor:crosshair;
  }

  #stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:var(--void);
  }

  /* --- ambient layers --------------------------------------------------- */
  .grid{
    position:absolute;
    inset:-80px;
    background-image:
      linear-gradient(rgba(90,150,220,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(90,150,220,.055) 1px,transparent 1px);
    background-size:68px 68px;
    animation:drift 60s linear infinite;
  }
  @keyframes drift{to{transform:translate3d(68px,68px,0)}}

  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 30%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.85) 100%);
  }
  .scan{
    position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px);
  }
  canvas{position:absolute;inset:0;display:block}

  #flash{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(60% 60% at var(--fx,0%) var(--fy,0%),rgba(255,255,255,.55),rgba(255,212,71,.25) 35%,transparent 70%);
  }
  #flash.go{animation:flash 1.4s cubic-bezier(.1,.7,.2,1) forwards}
  @keyframes flash{
    0%{opacity:1}12%{opacity:.35}20%{opacity:.9}34%{opacity:.2}48%{opacity:.6}100%{opacity:0}
  }

  #burst{
    position:absolute;pointer-events:none;opacity:0;
    font-family:Orbitron,"Share Tech Mono",monospace;font-weight:900;
    font-size:clamp(20px,3.4vw,46px);letter-spacing:.14em;
    color:#fff;text-shadow:0 0 24px rgba(255,212,71,.9),2px 0 0 var(--hot),-2px 0 0 var(--cyan);
    white-space:nowrap;
  }
  #burst.go{animation:burst 1.5s steps(1,end) forwards}
  @keyframes burst{
    0%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.25)}
    8%{opacity:.15;transform:translate(calc(var(--tx) + 8px),var(--ty)) scale(1)}
    16%{opacity:1;transform:translate(calc(var(--tx) - 6px),var(--ty)) scale(1)}
    30%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1)}
    72%{opacity:1}
    100%{opacity:0;transform:translate(var(--tx),calc(var(--ty) - 14px)) scale(1)}
  }

  /* --- HUD -------------------------------------------------------------- */
  .hud{
    position:absolute;z-index:5;
    opacity:.62;transition:opacity .25s ease;
    text-transform:uppercase;
    letter-spacing:.13em;
    font-size:11px;
    line-height:1.5;
    color:var(--ink-dim);
  }
  .hud:hover,.hud:focus-within{opacity:1}
  .tl{top:18px;left:20px}
  .tr{top:18px;right:20px;text-align:right}
  .bl{bottom:18px;left:20px}
  .br{bottom:18px;right:20px;text-align:right}

  .plate{
    background:var(--panel);
    border:1px solid var(--edge-lo);
    border-top-color:var(--edge-hi);
    border-left-color:var(--edge-hi);
    box-shadow:inset 0 0 22px rgba(60,110,190,.10),0 2px 14px rgba(0,0,0,.6);
    padding:11px 14px;
    backdrop-filter:blur(3px);
  }

  .badge{
    display:flex;align-items:center;gap:9px;
    font-family:Orbitron,monospace;font-weight:900;
    font-size:14px;letter-spacing:.24em;color:var(--ink);
  }
  .disc{
    width:13px;height:13px;border-radius:50%;
    background:conic-gradient(from 0deg,#7fe9ff,#ff6ad5,#ffe066,#7fe9ff);
    box-shadow:0 0 10px rgba(120,220,255,.55);
    position:relative;
  }
  .disc::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--void)}
  .tl .sub{margin-top:5px;color:var(--ink-faint);font-size:10px}

  .odds .v{
    font-family:Orbitron,monospace;font-weight:700;font-size:19px;
    color:var(--gold);letter-spacing:.1em;margin:2px 0;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(255,212,71,.35);
  }
  .odds .k{color:var(--ink-faint);font-size:10px}

  .console{min-width:238px}
  .big{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding-bottom:9px;margin-bottom:9px;
    border-bottom:1px solid rgba(120,170,240,.14);
  }
  .counter{
    font-family:Orbitron,monospace;font-weight:900;font-size:36px;line-height:.9;
    color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.03em;
    text-shadow:0 0 18px rgba(255,212,71,.45);
    transition:none;
  }
  .counter.pop{animation:pop .7s cubic-bezier(.2,1.5,.3,1)}
  @keyframes pop{
    0%{transform:scale(1);color:#fff;text-shadow:0 0 40px #fff}
    30%{transform:scale(1.35)}
    100%{transform:scale(1)}
  }
  .rows{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
  .rows .v2{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .rows .k{color:var(--ink-faint)}
  #status.lock{color:var(--gold);animation:blink .55s steps(1,end) infinite}
  #status.scr{color:var(--hot)}
  @keyframes blink{50%{opacity:.25}}
  .console.armed{border-top-color:var(--gold);border-left-color:var(--gold);box-shadow:inset 0 0 22px rgba(255,212,71,.12),0 2px 18px rgba(0,0,0,.6)}

  .hint{color:var(--ink-faint);font-size:10px;margin-bottom:7px}
  .btns{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
  button{
    font:inherit;text-transform:uppercase;letter-spacing:.12em;font-size:10px;
    color:var(--ink-dim);
    background:linear-gradient(180deg,rgba(40,52,76,.55),rgba(12,15,24,.55));
    border:1px solid var(--edge-lo);
    border-top-color:var(--edge-hi);border-left-color:var(--edge-hi);
    padding:5px 9px;cursor:pointer;
  }
  button:hover{color:#fff;border-color:rgba(120,200,255,.5)}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;color:#fff}
  button:active{background:linear-gradient(180deg,rgba(12,15,24,.7),rgba(40,52,76,.5))}
  .spd{color:var(--ink);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}

  @media (max-width:720px){
    .tl .sub,.hint{display:none}
    .hud{font-size:10px;letter-spacing:.1em}
    .counter{font-size:28px}
    .console{min-width:0}
    .bl{bottom:12px;left:12px}.br{bottom:12px;right:12px}
    .tl{top:12px;left:12px}.tr{top:12px;right:12px}
  }

  @media (prefers-reduced-motion:reduce){
    .grid{animation:none}
    #flash.go{animation-duration:.5s}
    #burst.go{animation:none;opacity:1}
  }
</style>

</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="scan"></div>
  <div id="flash"></div>
  <div id="burst">CORNER</div>

  <header class="hud tl">
    <div class="plate">
      <div class="badge"><span class="disc"></span>DVD Video</div>
      <div class="sub">Screensaver engine · build 2.03</div>
    </div>
  </header>

  <div class="hud tr odds">
    <div class="plate">
      <div class="k">Corner odds</div>
      <div class="v">1 : 100</div>
      <div class="k">per bounce</div>
    </div>
  </div>

  <section class="hud bl">
    <div class="plate console" id="console">
      <div class="big">
        <span class="k">Corner hits</span>
        <span id="hits" class="counter">000</span>
      </div>
      <div class="rows">
        <span class="k">Bounces</span><span id="bounces" class="v2">0</span>
        <span class="k">Build</span><span id="build" class="v2">—</span>
        <span class="k">Status</span><span id="status" class="v2">Tracking</span>
        <span class="k">All time</span><span id="alltime" class="v2">0</span>
      </div>
    </div>
  </section>

  <nav class="hud br">
    <div class="plate">
      <div class="hint">Click anywhere → rebuild the logo</div>
      <div class="btns">
        <button id="slower" aria-label="Slower">&minus;</button>
        <span class="spd" id="spd">1.0&times;</span>
        <button id="faster" aria-label="Faster">+</button>
        <button id="snd">Sound off</button>
        <button id="full">Fullscreen</button>
      </div>
    </div>
  </nav>
</div>

<script>
(function(){
  "use strict";

  var stage  = document.getElementById('stage');
  var cv     = document.getElementById('c');
  var ctx    = cv.getContext('2d');
  var tmp    = document.createElement('canvas');
  var tctx   = tmp.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var el = {
    hits:    document.getElementById('hits'),
    bounces: document.getElementById('bounces'),
    build:   document.getElementById('build'),
    status:  document.getElementById('status'),
    alltime: document.getElementById('alltime'),
    console: document.getElementById('console'),
    flash:   document.getElementById('flash'),
    burst:   document.getElementById('burst'),
    spd:     document.getElementById('spd')
  };

  var W = 0, H = 0, DPR = 1;

  /* ---------------------------------------------------------------- palette
     Y2K consumer-electronics hues: the colours a 2003 DVD player would
     have been proud of. One is picked fresh on every wall bounce.        */
  var PAL = [
    {n:'CYAN',    hex:'#00e7ff', glow:'rgba(0,231,255,.75)'},
    {n:'MAGENTA', hex:'#ff2ea6', glow:'rgba(255,46,166,.75)'},
    {n:'LIME',    hex:'#a6ff2e', glow:'rgba(166,255,46,.7)'},
    {n:'VIOLET',  hex:'#a35cff', glow:'rgba(163,92,255,.75)'},
    {n:'AMBER',   hex:'#ffb020', glow:'rgba(255,176,32,.7)'},
    {n:'AZURE',   hex:'#3b82ff', glow:'rgba(59,130,255,.75)'},
    {n:'EMBER',   hex:'#ff5a1f', glow:'rgba(255,90,31,.7)'},
    {n:'ICE',     hex:'#d9f6ff', glow:'rgba(217,246,255,.7)'}
  ];
  var col = PAL[0];

  function nextColour(){
    var c = col;
    while (c === col) c = PAL[(Math.random()*PAL.length)|0];
    col = c;
  }

  /* ------------------------------------------------------------- the logo
     Drawn once into an offscreen alpha mask, then cropped to its tight
     bounds so the bounce box is exactly the ink. Every build mode below
     is just a different way of painting through that one mask.          */
  var MASK = null, ASPECT = 1.9, CELLS = {}, RING = null;

  function roundRect(g,x,y,w,h,r){
    g.beginPath();
    g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);
    g.arcTo(x,y,x+w,y,r);
    g.closePath();
  }
  function setLS(g,v){ try{ g.letterSpacing = v; }catch(e){} }

  function buildMask(){
    var S = 2, MW = 480, MH = 264;
    var big = document.createElement('canvas');
    big.width = MW*S; big.height = MH*S;
    var g = big.getContext('2d',{willReadFrequently:true});
    g.scale(S,S);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff';

    // the swooping ellipse the wordmark sits inside
    g.save();
    g.translate(240,94);
    g.beginPath();
    g.ellipse(0,0,226,74,0,0,Math.PI*2);
    g.lineWidth = 15;
    g.stroke();
    g.restore();

    // DVD, heavy and raked over to the right
    g.save();
    g.translate(240,96);
    g.transform(1,0,-0.2,1,0,0);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    setLS(g,'-3px');
    g.font = '900 118px "Archivo Black","Arial Black",Impact,sans-serif';
    g.fillText('DVD',0,0);
    setLS(g,'0px');
    g.restore();

    // VIDEO knocked out of a pill
    var pw = 198, ph = 48, px = 240-pw/2, py = 196;
    g.save();
    roundRect(g,px,py,pw,ph,15);
    g.fill();
    g.globalCompositeOperation = 'destination-out';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    setLS(g,'8px');
    g.font = '700 27px Orbitron,"Share Tech Mono",monospace';
    g.fillText('VIDEO',244,py+ph/2+1);
    setLS(g,'0px');
    g.restore();

    // crop to ink
    var d = g.getImageData(0,0,big.width,big.height).data;
    var minX = big.width, minY = big.height, maxX = -1, maxY = -1, x, y, a;
    for (y=0;y<big.height;y++){
      for (x=0;x<big.width;x++){
        a = d[(y*big.width+x)*4+3];
        if (a>12){
          if (x<minX) minX = x;
          if (x>maxX) maxX = x;
          if (y<minY) minY = y;
          if (y>maxY) maxY = y;
        }
      }
    }
    if (maxX < 0){ minX = 0; minY = 0; maxX = big.width-1; maxY = big.height-1; }
    var cw = maxX-minX+1, ch = maxY-minY+1;
    var m = document.createElement('canvas');
    m.width = cw; m.height = ch;
    m.getContext('2d').drawImage(big,minX,minY,cw,ch,0,0,cw,ch);

    MASK = m; ASPECT = cw/ch; CELLS = {}; RING = null;
    sizeLogo();
  }

  // coverage grid, cached per column count — feeds every cell-based build
  function cells(n){
    if (CELLS[n]) return CELLS[n];
    var w = MASK.width, h = MASK.height;
    var rc = document.createElement('canvas');
    rc.width = w; rc.height = h;
    var mc = rc.getContext('2d',{willReadFrequently:true});
    mc.drawImage(MASK,0,0);
    var d = mc.getImageData(0,0,w,h).data;
    var cs = w/n, rows = Math.max(1,Math.round(h/cs)), rh = h/rows;
    var out = [], r, c, x, y, x0, x1, y0, y1, sum, cnt, cov;
    for (r=0;r<rows;r++){
      for (c=0;c<n;c++){
        x0 = Math.floor(c*cs); x1 = Math.min(w,Math.floor((c+1)*cs));
        y0 = Math.floor(r*rh);  y1 = Math.min(h,Math.floor((r+1)*rh));
        sum = 0; cnt = 0;
        for (y=y0;y<y1;y+=2){ for (x=x0;x<x1;x+=2){ sum += d[(y*w+x)*4+3]; cnt++; } }
        cov = cnt ? sum/cnt/255 : 0;
        if (cov > 0.09){
          out.push({
            u:(c+0.5)/n, v:(r+0.5)/rows, cov:cov,
            t:Math.random(), ph:Math.random()*Math.PI*2,
            dx:(Math.random()*2-1), dy:(Math.random()*2-1)
          });
        }
      }
    }
    out.cols = n; out.rows = rows;
    CELLS[n] = out;
    return out;
  }

  // dilate-minus-mask = a hairline vector ring around the artwork
  function ring(){
    if (RING) return RING;
    var pad = 7, o = document.createElement('canvas');
    o.width = MASK.width+pad*2; o.height = MASK.height+pad*2;
    var g = o.getContext('2d'), i, a;
    for (i=0;i<14;i++){
      a = i/14*Math.PI*2;
      g.drawImage(MASK, pad+Math.cos(a)*4.5, pad+Math.sin(a)*4.5);
    }
    g.globalCompositeOperation = 'destination-out';
    g.drawImage(MASK,pad,pad);
    RING = o; RING.pad = pad;
    return RING;
  }

  // scratch surfaces: paint a colour/gradient *through* an alpha source
  function pad(){ var c = document.createElement('canvas'); return {c:c,x:c.getContext('2d')}; }
  var S1 = pad(), S2 = pad(), S3 = pad();

  function through(s,src,w,h,paint){
    w = Math.max(1,Math.round(w)); h = Math.max(1,Math.round(h));
    if (s.c.width !== w || s.c.height !== h){ s.c.width = w; s.c.height = h; }
    s.x.setTransform(1,0,0,1,0,0);
    s.x.globalAlpha = 1;
    s.x.globalCompositeOperation = 'source-over';
    s.x.clearRect(0,0,w,h);
    s.x.drawImage(src,0,0,w,h);
    s.x.globalCompositeOperation = 'source-in';
    paint(s.x,w,h);
    s.x.globalCompositeOperation = 'source-over';
    return s.c;
  }

  /* ------------------------------------------------------------ the builds
     Eleven ways of making the same logo. A click picks a new one.       */
  function glow(g,mult){
    g.shadowColor = col.glow;
    g.shadowBlur = (mult||1) * 16;
  }

  var MODES = [
    {id:'solid', n:'Solid cast', draw:function(g,b){
      var s = through(S1,MASK,b.w*DPR,b.h*DPR,function(x,w,h){ x.fillStyle = col.hex; x.fillRect(0,0,w,h); });
      g.save(); glow(g,1.4); g.drawImage(s,b.x,b.y,b.w,b.h); g.restore();
    }},

    {id:'chrome', n:'Chrome press', draw:function(g,b){
      var s = through(S1,MASK,b.w*DPR,b.h*DPR,function(x,w,h){
        var gr = x.createLinearGradient(0,0,0,h);
        gr.addColorStop(0,'#f2f7ff'); gr.addColorStop(.30,'#8ea6c8');
        gr.addColorStop(.46,'#1b2334'); gr.addColorStop(.50,col.hex);
        gr.addColorStop(.56,'#243049'); gr.addColorStop(.78,'#e7f0ff');
        gr.addColorStop(1,'#5d7ba8');
        x.fillStyle = gr; x.fillRect(0,0,w,h);
      });
      g.save(); g.shadowColor = 'rgba(180,220,255,.5)'; g.shadowBlur = 14;
      g.drawImage(s,b.x,b.y,b.w,b.h); g.restore();
      var r = ring(), p = r.pad*(b.w/MASK.width);
      var rs = through(S2,r,(MASK.width+r.pad*2)*(b.w/MASK.width)*DPR,(MASK.height+r.pad*2)*(b.w/MASK.width)*DPR,function(x,w,h){
        x.fillStyle = col.hex; x.fillRect(0,0,w,h);
      });
      g.save(); g.globalAlpha = .9; glow(g,1);
      g.drawImage(rs,b.x-p,b.y-p,b.w+p*2,b.h+p*2); g.restore();
    }},

    {id:'outline', n:'Vector outline', draw:function(g,b){
      var r = ring(), k = b.w/MASK.width, p = r.pad*k;
      var rs = through(S1,r,(MASK.width+r.pad*2)*k*DPR,(MASK.height+r.pad*2)*k*DPR,function(x,w,h){
        x.fillStyle = col.hex; x.fillRect(0,0,w,h);
      });
      g.save(); glow(g,1.8);
      g.drawImage(rs,b.x-p,b.y-p,b.w+p*2,b.h+p*2);
      g.globalAlpha = .5; g.drawImage(rs,b.x-p,b.y-p,b.w+p*2,b.h+p*2);
      g.restore();
    }},

    {id:'dots', n:'Dot matrix', cell:56, draw:function(g,b,t,rev){
      var cs = cells(56), i, c, x, y, rr, cw = b.w/56;
      g.save(); glow(g,.9); g.fillStyle = col.hex;
      for (i=0;i<cs.length;i++){
        c = cs[i];
        if (rev < 1 && c.t > rev) continue;
        x = b.x + c.u*b.w; y = b.y + c.v*b.h;
        rr = cw*0.52*c.cov*(0.85+0.15*Math.sin(t*3+c.ph));
        if (rev < 1) rr *= Math.min(1,(rev-c.t)*8);
        if (rr <= 0.2) continue;
        g.globalAlpha = 0.45+0.55*c.cov;
        g.beginPath(); g.arc(x,y,rr,0,6.2832); g.fill();
      }
      g.restore();
    }},

    {id:'ascii', n:'Ascii terminal', cell:44, draw:function(g,b,t,rev){
      var ramp = '.:-=+*#%@', cs = cells(44), i, c, x, y, ch, cw = b.w/44;
      g.save();
      g.font = (cw*1.35).toFixed(1)+'px "Share Tech Mono",monospace';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = col.glow; g.shadowBlur = 8;
      for (i=0;i<cs.length;i++){
        c = cs[i];
        if (rev < 1 && c.t > rev) continue;
        x = b.x + c.u*b.w; y = b.y + c.v*b.h;
        ch = (c.t > .93) ? ((Math.floor(t*6+i)%2) ? '1' : '0')
                         : ramp[Math.min(ramp.length-1,Math.floor(c.cov*ramp.length))];
        g.fillStyle = c.t > .88 ? '#ffffff' : col.hex;
        g.globalAlpha = 0.35+0.65*c.cov;
        g.fillText(ch,x,y);
      }
      g.restore();
    }},

    {id:'blocks', n:'Pixel blocks', cell:34, draw:function(g,b,t,rev){
      var cs = cells(34), i, c, x, y, s, cw = b.w/34;
      g.save(); glow(g,.7);
      for (i=0;i<cs.length;i++){
        c = cs[i];

  ];
  var mode = MODES[3];

  /* ------------------------------------------------------- entry animations

  var TRANS = [
    {id:'spin',    f:function(p){ var e = out(p); return {s:0.25+0.75*e, sy:1, rot:(1-e)*-4.4, a:Math.min(1,p*2.5), rev:1, clip:0}; }},
    {id:'flip',    f:function(p){ var e = io(p); return {s:1, sx:-1+2*e, sy:1, rot:0, a:1, rev:1, clip:0}; }},
    {id:'pop',     f:function(p){ var e = back(p); return {s:0.2+e*0.8, sy:1, rot:0, a:Math.min(1,p*3), rev:1, clip:0}; }},
    {id:'crt',     f:function(p){ var e = out(p); return {s:1, sx:1+(1-e)*0.5, sy:0.02+0.98*e, rot:0, a:1, rev:1, clip:0}; }},
    {id:'stutter', f:function(p){ var e = out(p); return {s:1, sy:1, rot:0, a:(p<0.75 && Math.random()<0.25)?0.15:1, jx:(1-e)*(Math.random()*2-1)*34, jy:(1-e)*(Math.random()*2-1)*14, rev:1, clip:0}; }},
    {id:'wipe',    f:function(p){ var e = io(p); return {s:1, sy:1, rot:0, a:1, rev:e, clip:1}; }},
    {id:'iris',    f:function(p){ var e = out(p); return {s:1, sy:1, rot:0, a:1, rev:e, clip:2}; }},
    {id:'dissolve',f:function(p){ return {s:1, sy:1, rot:0, a:1, rev:p, clip:3}; }}
  ];
  var trans = TRANS[2], tStart = 0, TDUR = 0.85;

  function out(p){ return 1-Math.pow(1-p,3); }
  function io(p){ return p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }
  function back(p){ var c1 = 1.9, c3 = c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); }

  /* ------------------------------------------------------------- the physics
     Bounce, and on every bounce roll a hundred-sided die: on a 1 the
     trajectory is re-aimed at the corner it is already heading toward.  */
  var L = {x:120,y:120,vx:1,vy:1,w:200,h:105};
  var speedMul = 1, armed = false, armT = 0, target = null;
  var hits = 0, bounces = 0, allTime = 0;
  var scratch = 0, sparks = [], waves = [], stutterHold = 0, jitter = {x:0,y:0};

  function baseSpeed(){ return 148 * (Math.max(W,H)/1280) * speedMul; }

  function sizeLogo(){
    var base = Math.max(118, Math.min(W*0.17, 300));
    L.w = base; L.h = base/ASPECT;
    L.x = Math.min(Math.max(0,L.x), Math.max(0,W-L.w));
    L.y = Math.min(Math.max(0,L.y), Math.max(0,H-L.h));
  }

  function setHeading(ang){
    var s = baseSpeed();
    L.vx = Math.cos(ang)*s; L.vy = Math.sin(ang)*s;
  }

  function arm(){
    var tx = (L.vx > 0) ? (W-L.w) : 0;
    var ty = (L.vy > 0) ? (H-L.h) : 0;
    var dx = tx-L.x, dy = ty-L.y, d = Math.hypot(dx,dy);
    if (d < 2) return;
    var s = baseSpeed();
    L.vx = dx/d*s; L.vy = dy/d*s;
    armT = d/s; target = {x:tx,y:ty};
    armed = true;
    el.status.textContent = 'Lock on';
    el.status.className = 'v2 lock';
    el.console.classList.add('armed');
  }

  function bounced(){
    bounces++;
    el.bounces.textContent = bounces;
    nextColour();
    if (!armed && Math.random() < 0.01) arm();
  }

  function step(dt){
    if (stutterHold > 0){ stutterHold -= dt; return; }

    if (armed){
      if (dt >= armT){
        L.x = target.x; L.y = target.y;
        armed = false; target = null;
        cornerHit();
        var ang = Math.atan2(-L.vy,-L.vx) + (Math.random()*0.5-0.25);
        setHeading(ang);
        return;
      }
      armT -= dt;
      L.x += L.vx*dt; L.y += L.vy*dt;
      return;
    }

    L.x += L.vx*dt; L.y += L.vy*dt;

    var hx = false, hy = false;
    if (L.x <= 0){ L.x = 0; L.vx = Math.abs(L.vx); hx = true; }
    else if (L.x+L.w >= W){ L.x = W-L.w; L.vx = -Math.abs(L.vx); hx = true; }
    if (L.y <= 0){ L.y = 0; L.vy = Math.abs(L.vy); hy = true; }
    else if (L.y+L.h >= H){ L.y = H-L.h; L.vy = -Math.abs(L.vy); hy = true; }

    if (hx && hy){ bounced(); cornerHit(); return; }
    if (hx || hy) bounced();
  }

  /* --------------------------------------------------------- the payoff
     Disc skip: counter climbs, the picture tears, the logo stutters.    */
  function cornerHit(){
    hits++; allTime++;
    el.hits.textContent = String(hits).padStart(3,'0');
    el.alltime.textContent = allTime;
    el.hits.classList.remove('pop');
    void el.hits.offsetWidth;
    el.hits.classList.add('pop');
    try { localStorage.setItem('cornerOdds.allTime', String(allTime)); } catch(e){}

    scratch = reduce ? 0.55 : 1;
    el.status.textContent = 'Disc skip';
    el.status.className = 'v2 scr';
    el.console.classList.remove('armed');

    var cx = L.x + L.w/2, cy = L.y + L.h/2;
    var px = (L.x < W/2) ? 0 : 100, py = (L.y < H/2) ? 0 : 100;
    el.flash.style.setProperty('--fx',px+'%');
    el.flash.style.setProperty('--fy',py+'%');
    el.flash.classList.remove('go'); void el.flash.offsetWidth; el.flash.classList.add('go');

    el.burst.style.setProperty('--tx', (px ? -110 : 10)+'%');
    el.burst.style.setProperty('--ty','0%');
    el.burst.style.left = (px ? W-20 : 20)+'px';
    el.burst.style.top  = (py ? H-90 : 74)+'px';
    el.burst.textContent = 'Corner #'+hits;
    el.burst.classList.remove('go'); void el.burst.offsetWidth; el.burst.classList.add('go');

    waves.push({x:cx,y:cy,t:0});
    var i, a, sp;
    for (i=0;i<70;i++){
      a = Math.random()*Math.PI*2;
      sp = 90+Math.random()*520;
      sparks.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:0.5+Math.random()*0.8,c:Math.random()<0.4?'#ffffff':col.hex});
    }
    skipSound();
  }

  /* ------------------------------------------------------------- rendering */
  var noise = (function(){
    var n = document.createElement('canvas'); n.width = 220; n.height = 220;
    var g = n.getContext('2d'), d = g.createImageData(220,220), i, v;
    for (i=0;i<d.data.length;i+=4){
      v = Math.random() < 0.5 ? 255 : 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = Math.random() < 0.10 ? 255 : 0;
    }
    g.putImageData(d,0,0);

  function clipReveal(g,b,kind,r){
    if (r >= 1) return;
    g.beginPath();
    if (kind === 1){ g.rect(b.x-40,b.y-40,b.w+80,Math.max(0,(b.h+80)*r)); }
    else if (kind === 2){ g.arc(b.x+b.w/2,b.y+b.h/2,Math.max(0,r*Math.hypot(b.w,b.h)*0.62),0,6.2832); }
    else {
      var n = 11, i, hgt = (b.h+40)/n;
      for (i=0;i<n;i++){
        if ((i*0.618)%1 < r*1.15) g.rect(b.x-40,b.y-20+i*hgt,b.w+80,hgt+0.5);
      }
    }
    g.clip();
  }

  function drawLogo(t){
    var p = Math.max(0, Math.min(1,(t-tStart)/TDUR));
    var tr = trans.f(p);
    var b = {x:L.x+jitter.x, y:L.y+jitter.y, w:L.w, h:L.h};
    var cx = b.x+b.w/2, cy = b.y+b.h/2;

    ctx.save();
    ctx.globalAlpha = tr.a === undefined ? 1 : tr.a;
    ctx.translate(cx+(tr.jx||0), cy+(tr.jy||0));
    if (tr.rot) ctx.rotate(tr.rot);
    var sx = (tr.sx !== undefined ? tr.sx : (tr.s||1));
    var sy = (tr.s||1)*(tr.sy !== undefined ? tr.sy : 1);
    if (Math.abs(sx) < 0.004) sx = sx < 0 ? -0.004 : 0.004;
    if (Math.abs(sy) < 0.004) sy = 0.004;
    ctx.scale(sx,sy);
    ctx.translate(-cx,-cy);
    var rev = tr.rev === undefined ? 1 : tr.rev;
    if (mode.cell) {
      mode.draw(ctx,b,t,rev);
    } else {
      if (rev < 1) clipReveal(ctx,b,tr.clip||1,rev);
      mode.draw(ctx,b,t,1);

    // CRT power-on line

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = col.glow; ctx.shadowBlur = 22;
      ctx.fillRect(cx-b.w*0.9, cy-1, b.w*1.8, 2);
      ctx.restore();
    }
  }

  function drawTelegraph(t){
    if (!armed || !target) return;
    var tx = target.x + ((L.vx > 0) ? L.w : 0);
    var ty = target.y + ((L.vy > 0) ? L.h : 0);
    var k = 0.4+0.6*Math.abs(Math.sin(t*4));

    ctx.globalAlpha = 0.25+0.45*k;
    ctx.strokeStyle = '#ffd447';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255,212,71,.7)'; ctx.shadowBlur = 12;

    ctx.moveTo(tx+dx*len, ty); ctx.lineTo(tx, ty); ctx.lineTo(tx, ty+dy*len);

    ctx.globalAlpha = 0.12+0.12*k;
    ctx.setLineDash([7,9]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.x+L.w/2,L.y+L.h/2); ctx.lineTo(target.x+L.w/2,target.y+L.h/2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawFx(dt){
    var i, s, w;
    for (i=sparks.length-1;i>=0;i--){
      s = sparks[i];
      s.t += dt;
      if (s.t > s.life){ sparks.splice(i,1); continue; }

      ctx.restore();
    }
    for (i=waves.length-1;i>=0;i--){
      w = waves[i]; w.t += dt;
      if (w.t > 1.1){ waves.splice(i,1); continue; }

      ctx.globalAlpha = Math.max(0,1-w.t/1.1)*0.55;

      ctx.restore();

  function scratchPass(k){
    if (tmp.width !== cv.width || tmp.height !== cv.height){ tmp.width = cv.width; tmp.height = cv.height; }
    tctx.setTransform(1,0,0,1,0,0);
    tctx.clearRect(0,0,tmp.width,tmp.height);
    tctx.drawImage(cv,0,0);

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    var bands = 16, i, y, hgt, off;
    for (i=0;i<bands;i++){
      y = i*(H/bands); hgt = H/bands+1;
      off = (Math.random() < 0.45) ? (Math.random()*2-1)*90*k : 0;

      ctx.fillStyle = Math.random() < 0.5 ? '#ffffff' : col.hex;

  /* ------------------------------------------------------------- main loop */
  var last = 0, running = true;

  function frame(now){
    if (!running) return;
    requestAnimationFrame(frame);
    var t = now/1000;
    var dt = Math.min(0.05, last ? t-last : 0.016);
    last = t;

    if (!MASK) return;

    if (scratch > 0){
      scratch = Math.max(0, scratch - dt/1.5);
      if (!reduce && Math.random() < 0.16){ stutterHold = 0.02+Math.random()*0.09; }
      jitter.x = (Math.random()*2-1)*10*scratch;
      jitter.y = (Math.random()*2-1)*5*scratch;
      if (scratch === 0){
        jitter.x = jitter.y = 0;
        el.status.textContent = 'Tracking';
        el.status.className = 'v2';
      }
    }

    step(dt);

    // phosphor trail: fade what's there rather than repainting the ground
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';

    drawTelegraph(t);
    drawLogo(t);
    drawFx(dt);

    if (scratch > 0.02) scratchPass(scratch);
  }

  /* ------------------------------------------------------------- interaction */
  function regen(){
    var m = mode, tr = trans;
    while (m === mode) m = MODES[(Math.random()*MODES.length)|0];
    while (tr === trans) tr = TRANS[(Math.random()*TRANS.length)|0];
    mode = m; trans = tr;
    tStart = performance.now()/1000;
    nextColour();
    el.build.textContent = mode.n;
  }

  stage.addEventListener('pointerdown',function(e){
    if (e.target.closest('button')) return;
    regen();
  });

  window.addEventListener('keydown',function(e){
    if (e.code === 'Space' || e.key === 'Enter'){ e.preventDefault(); regen(); }
    else if (e.key === 'f' || e.key === 'F'){ toggleFull(); }
    else if (e.key === 'm' || e.key === 'M'){ toggleSound(); }
  });

  function setSpeed(v){
    speedMul = Math.min(3, Math.max(0.3, +v.toFixed(1)));
    el.spd.innerHTML = speedMul.toFixed(1)+'&times;';
    var ang = Math.atan2(L.vy,L.vx);
    setHeading(ang);
    if (armed && target){
      var d = Math.hypot(target.x-L.x, target.y-L.y);
      var s = baseSpeed();
      L.vx = (target.x-L.x)/d*s; L.vy = (target.y-L.y)/d*s; armT = d/s;
    }
  }
  document.getElementById('slower').addEventListener('click',function(){ setSpeed(speedMul-0.2); });
  document.getElementById('faster').addEventListener('click',function(){ setSpeed(speedMul+0.2); });

  function toggleFull(){
    var d = document;
    if (d.fullscreenElement){ d.exitFullscreen(); }
    else if (stage.requestFullscreen){ stage.requestFullscreen().catch(function(){}); }
  }
  document.getElementById('full').addEventListener('click',toggleFull);
  document.addEventListener('fullscreenchange',function(){
    document.getElementById('full').textContent = document.fullscreenElement ? 'Exit full' : 'Fullscreen';
    resize();
  });

  var AC = null, sndOn = false, nbuf = null;
  function toggleSound(){
    sndOn = !sndOn;
    document.getElementById('snd').textContent = sndOn ? 'Sound on' : 'Sound off';
    if (sndOn && !AC){
      try {
        AC = new (window.AudioContext||window.webkitAudioContext)();
        nbuf = AC.createBuffer(1, AC.sampleRate*0.4, AC.sampleRate);
        var d = nbuf.getChannelData(0), i;
        for (i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      } catch(e){ AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
  }
  document.getElementById('snd').addEventListener('click',toggleSound);

  function skipSound(){
    if (!sndOn || !AC || !nbuf) return;
    var n = 6, i;
    for (i=0;i<n;i++){
      (function(k){
        var t0 = AC.currentTime + k*0.075;
        var src = AC.createBufferSource(); src.buffer = nbuf;
        var bp = AC.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.setValueAtTime(900+Math.random()*2600,t0); bp.Q.value = 6;
        var g = AC.createGain();
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(0.16*(1-k/n)+0.02,t0+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+0.055);
        src.connect(bp); bp.connect(g); g.connect(AC.destination);
        src.start(t0); src.stop(t0+0.07);
      })(i);
    }
  }

  document.addEventListener('visibilitychange',function(){
    if (document.hidden){ running = false; }
    else if (!running){ running = true; last = 0; requestAnimationFrame(frame); }
  });

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = stage.clientWidth || window.innerWidth;
    H = stage.clientHeight || window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    tmp.width = cv.width; tmp.height = cv.height;
    if (MASK) sizeLogo();
  }
  window.addEventListener('resize',resize);

  /* ------------------------------------------------------------------ boot */
  try {
    var stored = localStorage.getItem('cornerOdds.allTime');
    if (stored) allTime = parseInt(stored,10) || 0;
  } catch(e){}
  el.alltime.textContent = allTime;

  resize();
  buildMask();
  L.x = W*0.28; L.y = H*0.3;
  setHeading((Math.random()*0.55+0.35) * (Math.random()<0.5?1:-1) + (Math.random()<0.5?0:Math.PI));
  mode = MODES[3]; trans = TRANS[3];
  el.build.textContent = mode.n;
  el.hits.textContent = '000';
  tStart = performance.now()/1000;
  requestAnimationFrame(frame);

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ buildMask(); });
  }
})();
</script>
